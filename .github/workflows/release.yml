# DevStore: every push to main builds both parts. A bumped versionCode releases the APK
# (tag android-v...), a bumped version in windows/devstore.json releases the Windows
# companion (tag windows-v...). Each part releases on its own.
name: Release

on:
  push:
    branches: [main]
  # Test builds: every pull request from a branch in this repo gets a
  # pre-release you can install before merging; closing the PR deletes them.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    uses: qawalah/devstore/.github/workflows/android-release.yml@main
    with:
      working-directory: android
    secrets: inherit

  windows:
    uses: qawalah/devstore/.github/workflows/windows-release.yml@main
    with:
      working-directory: windows
      dotnet-version: 8.0.x   # windows/global.json pins 8.0.100 (rollForward latestMajor)
